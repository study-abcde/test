<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>共テ暗記（化学・物理・政経）</title>
<style>
:root{
  --bg:#f2f5f7; --surface:#ffffff; --ink:#17212b; --sub:#5b6b79; --line:#d5dde3;
  --accent:#0b6e8a; --accent-ink:#ffffff; --ok:#1d7a4a; --ok-bg:#e1f3e9; --ng:#b4322b; --ng-bg:#fbe7e5;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#10161b; --surface:#19222a; --ink:#e8eef2; --sub:#93a3b0; --line:#2c3a45;
    --accent:#4cb6d3; --accent-ink:#08242d; --ok:#6fd49b; --ok-bg:#16352a; --ng:#f0897f; --ng-bg:#3b1f1d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  line-height:1.7; padding:16px; min-height:100vh;
}
main{max-width:560px; margin:0 auto}
h1{font-size:1.25rem; margin:4px 0 2px}
.stat{color:var(--sub); font-size:.9rem; margin:0 0 14px}
.row{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:12px}
select,button{font:inherit; color:inherit}
select{
  background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:8px 10px; flex:1; min-width:0;
}
label.chk{display:flex; align-items:center; gap:6px; font-size:.95rem; white-space:nowrap}
.tabs{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; margin-bottom:16px; background:var(--surface)}
.tabs button{flex:1; border:0; background:transparent; padding:10px 0; cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:24px 20px; min-height:200px; display:flex; flex-direction:column; justify-content:center;
  cursor:pointer; user-select:none;
}
.cat{font-size:.8rem; color:var(--sub); margin-bottom:10px}
.q{font-size:1.3rem; font-weight:700}
.a{font-size:1.5rem; font-weight:700; color:var(--accent); margin-top:14px; padding-top:14px; border-top:1px dashed var(--line)}
.hint{font-size:.85rem; color:var(--sub); margin-top:14px}
.actions{display:flex; gap:10px; margin-top:14px}
.btn{
  flex:1; border:1px solid var(--line); background:var(--surface); border-radius:10px;
  padding:12px; cursor:pointer; font-weight:700;
}
.btn.main{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.btn.ok{color:var(--ok)} .btn.ng{color:var(--ng)}
.btn:focus-visible,select:focus-visible,.tabs button:focus-visible,.card:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.choices{display:grid; gap:10px; margin-top:14px}
.choice{
  text-align:left; border:1px solid var(--line); background:var(--surface);
  border-radius:10px; padding:12px 14px; cursor:pointer;
}
.choice.right{background:var(--ok-bg); border-color:var(--ok); color:var(--ok); font-weight:700}
.choice.wrong{background:var(--ng-bg); border-color:var(--ng); color:var(--ng)}
.msg{margin-top:12px; font-weight:700}
.empty{padding:40px 10px; text-align:center; color:var(--sub)}
.small{font-size:.8rem; color:var(--sub); text-align:center; margin-top:22px}
.link{background:none; border:0; color:var(--sub); text-decoration:underline; cursor:pointer; font-size:.8rem}
.q,.a{white-space:pre-wrap; overflow-wrap:anywhere}
h2{font-size:1.05rem; margin:22px 0 4px}
.form{display:grid; gap:10px}
.form label{display:grid; gap:4px; font-size:.9rem; color:var(--sub)}
.form input,.form textarea{
  font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line);
  border-radius:8px; padding:9px 10px; width:100%;
}
.form input:focus-visible,.form textarea:focus-visible{outline:3px solid var(--accent); outline-offset:1px}
.list{display:grid; gap:8px; margin:10px 0 14px}
.item{display:flex; gap:10px; align-items:flex-start; justify-content:space-between; background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px 12px}
.itext{min-width:0; overflow-wrap:anywhere; white-space:pre-wrap}
.item .cat{margin-bottom:2px}
.del{flex:none; padding:6px 10px; font-weight:400}
.filebtn{text-align:center}
</style>
</head>

</main>

// ===== 状態 =====
// 記録は「問題文」をキーに保存するので、問題を追加・並べ替えしてもずれません
const KEY = "chem-memo-v2", CKEY = "chem-memo-custom-v1";
let store = {known:[], weak:[]};
try {
  const t = JSON.parse(localStorage.getItem(KEY) || "{}");
  store.known = Array.isArray(t.known) ? t.known.filter(x => typeof x === "string") : [];
  store.weak  = Array.isArray(t.weak)  ? t.weak.filter(x => typeof x === "string")  : [];
} catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e){} };

let custom = [];
try {
  const t = JSON.parse(localStorage.getItem(CKEY) || "[]");
  if (Array.isArray(t)) custom = t.filter(c => Array.isArray(c) && c.length === 3 && c.every(x => typeof x === "string"));
} catch(e){}
const saveCustom = () => { try { localStorage.setItem(CKEY, JSON.stringify(custom)); } catch(e){} };

const BASE_CATS = new Set(BASE.map(c => c[0]));
let CARDS = BASE.concat(custom);
const refreshCards = () => { CARDS = BASE.concat(custom); buildCatSelect(); };

const $ = s => document.querySelector(s);
const view = $("#view");
let mode = "card", queue = [], pos = 0, flipped = false, answered = false, quizScore = {ok:0, total:0}, current = null;

// ===== ユーティリティ =====
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const groupOf = c => c.startsWith("政経") ? "政経" : c.startsWith("物理") ? "物理" : BASE_CATS.has(c) ? "化学" : "自作";
const disp = c => c.replace(/^(政経|物理)：/, "");
const addTo = (k,key) => { if(!store[k].includes(key)) store[k].push(key); };
const removeFrom = (k,key) => { store[k] = store[k].filter(x => x !== key); };

function buildCatSelect(){
  const sel = $("#cat"), cur = sel.value || "all";
  const cats = [...new Set(CARDS.map(c => c[0]))];
  const grp = (label, key, extra) => {
    const list = cats.filter(c => groupOf(c) === key);
    if (!list.length) return "";
    return `<optgroup label="${label}"><option value="subj:${key}">${label}すべて</option>${extra||""}` +
      list.map(c => `<option value="${esc(c)}">${esc(key==="化学"||key==="自作" ? c : disp(c))}</option>`).join("") + `</optgroup>`;
  };
  sel.innerHTML = `<option value="all">すべて</option>` +
    grp("化学","化学",`<option value="subj:有機">有機すべて</option>`) +
    grp("物理","物理") + grp("政治経済","政経") + grp("自作","自作");
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : "all";
}
function pool(){
  const c = $("#cat").value, w = $("#weakOnly").checked;
  const match = i => {
    const k = CARDS[i][0];
    if (c === "all") return true;
    if (c.startsWith("subj:")){ const g = c.slice(5); return g === "有機" ? k.startsWith("有機") : groupOf(k) === g; }
    return k === c;
  };
  return CARDS.map((_,i)=>i).filter(i => match(i) && (!w || store.weak.includes(CARDS[i][1])));
}
function updateStat(){
  const keys = new Set(CARDS.map(c => c[1]));
  const known = store.known.filter(k => keys.has(k)).length;
  const weak  = store.weak.filter(k => keys.has(k)).length;
  $("#stat").textContent = `覚えた ${known} / ${CARDS.length}　苦手 ${weak}`;
}
function rebuild(){
  queue = shuffle(pool()); pos = 0; flipped = false; answered = false; current = null; quizScore = {ok:0,total:0};
  render();
}

// ===== 描画 =====
function render(){
  updateStat();
  $("#filters").style.display = mode === "manage" ? "none" : "";
  if (mode === "manage") return renderManage();
  if (!queue.length){
    view.innerHTML = `<div class="empty">この条件の問題がありません。<br>「苦手のみ」を外すか、分野を変えてください。</div>`;
    return;
  }
  if (pos >= queue.length){
    const extra = mode==="quiz" ? `<p>正解 ${quizScore.ok} / ${quizScore.total}</p>` : "";
    view.innerHTML = `<div class="empty"><p><b>一周しました（${queue.length}問）</b></p>${extra}</div>
      <div class="actions"><button class="btn main" id="again">もう一周</button></div>`;
    $("#again").onclick = rebuild;
    return;
  }
  mode === "card" ? renderCard() : renderQuiz();
}

function renderCard(){
  const [cat,q,a] = CARDS[queue[pos]];
  view.innerHTML = `
    <div class="card" id="card" tabindex="0" role="button" aria-label="カードをめくる">
      <div class="cat">${esc(cat)}　${pos+1} / ${queue.length}</div>
      <div class="q">${esc(q)}</div>
      ${flipped ? `<div class="a">${esc(a)}</div>` : `<div class="hint">タップして答えを見る</div>`}
    </div>
    ${flipped ? `<div class="actions">
      <button class="btn ng" id="no">まだ</button>
      <button class="btn ok" id="yes">覚えた</button>
    </div>` : ""}`;
  $("#card").onclick = () => { flipped = !flipped; renderCard(); };
  if (flipped){
    $("#no").onclick  = () => mark(false);
    $("#yes").onclick = () => mark(true);
  }
}
function mark(ok){
  const key = CARDS[queue[pos]][1];
  if (ok){ addTo("known",key); removeFrom("weak",key); }
  else   { addTo("weak",key);  removeFrom("known",key); }
  save(); pos++; flipped = false; render();
}

function renderQuiz(){
  const id = queue[pos]; const [cat,q,a] = CARDS[id];
  if (current !== id){
    current = id; answered = false;
    let others = [...new Set(CARDS.filter(c => c[0]===cat && c[2]!==a).map(c=>c[2]))];
    if (others.length < 3) others = [...new Set(CARDS.filter(c => c[2]!==a).map(c=>c[2]))];
    renderQuiz.choices = shuffle([a, ...shuffle(others).slice(0,3)]);
  }
  view.innerHTML = `
    <div class="card" style="cursor:default">
      <div class="cat">${esc(cat)}　${pos+1} / ${queue.length}</div>
      <div class="q">${esc(q)}</div>
    </div>
    <div class="choices">${renderQuiz.choices.map((c,i)=>`<button class="choice" data-i="${i}">${esc(c)}</button>`).join("")}</div>
    <div id="after"></div>`;
  view.querySelectorAll(".choice").forEach(b => b.onclick = () => pick(b, id));
}
function pick(btn, id){
  if (answered) return; answered = true;
  const key = CARDS[id][1], a = CARDS[id][2], chosen = renderQuiz.choices[+btn.dataset.i], ok = chosen === a;
  quizScore.total++; if (ok) quizScore.ok++;
  if (ok){ addTo("known",key); removeFrom("weak",key); } else { addTo("weak",key); removeFrom("known",key); }
  save(); updateStat();
  view.querySelectorAll(".choice").forEach(b => {
    const v = renderQuiz.choices[+b.dataset.i];
    if (v === a) b.classList.add("right");
    else if (b === btn) b.classList.add("wrong");
  });
  $("#after").innerHTML = `<div class="msg" style="color:var(${ok?"--ok":"--ng"})">${ok?"正解":"不正解　正しい答え：" + esc(a)}</div>
    <div class="actions"><button class="btn main" id="next">次へ</button></div>`;
  $("#next").onclick = () => { pos++; current = null; render(); };
}

// ===== 自作カードの追加・管理 =====
let lastCat = "", manageMsg = "";
function renderManage(){
  const cats = [...new Set(CARDS.map(c => c[0]))];
  view.innerHTML = `
    <form id="addf" class="form" autocomplete="off">
      <label>分野<input id="f-cat" list="catlist" placeholder="例：物理：力学　（新しい名前なら新しい分野になります）" required></label>
      <datalist id="catlist">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
      <label>問題<textarea id="f-q" rows="2" required></textarea></label>
      <label>答え<textarea id="f-a" rows="2" required></textarea></label>
      <button class="btn main" type="submit">カードを追加</button>
    </form>
    <p class="msg" id="addmsg" role="status">${esc(manageMsg)}</p>
    <h2>自作カード（${custom.length}枚）</h2>
    <p class="hint">自作カードはこのブラウザにだけ保存されます。別の端末で使うときは、書き出して読み込んでください。</p>
    <div class="list">${custom.length ? custom.map((c,i)=>`
      <div class="item">
        <div class="itext"><div class="cat">${esc(c[0])}</div><div><b>${esc(c[1])}</b></div><div>${esc(c[2])}</div></div>
        <button class="btn ng del" data-i="${i}" aria-label="削除">削除</button>
      </div>`).join("") : `<div class="empty">まだありません。</div>`}</div>
    <div class="actions">
      <button class="btn" id="exp" type="button">書き出し（JSON）</button>
      <label class="btn filebtn">読み込み<input type="file" id="imp" accept="application/json,.json" hidden></label>
    </div>`;
  $("#f-cat").value = lastCat;
  $("#addf").onsubmit = e => {
    e.preventDefault();
    const cat = $("#f-cat").value.trim(), q = $("#f-q").value.trim(), a = $("#f-a").value.trim();
    if (!cat || !q || !a) return;
    if (CARDS.some(c => c[1] === q)){ manageMsg = "同じ問題文のカードがすでにあります。文を少し変えてください。"; return renderManage(); }
    custom.push([cat,q,a]); saveCustom(); lastCat = cat; manageMsg = "追加しました。";
    refreshCards(); updateStat(); renderManage();
    $("#f-q").focus();
  };
  view.querySelectorAll(".del").forEach(b => b.onclick = () => {
    const c = custom[+b.dataset.i];
    if (!confirm(`このカードを削除します。\n${c[1]}`)) return;
    custom.splice(+b.dataset.i, 1); saveCustom();
    removeFrom("known", c[1]); removeFrom("weak", c[1]); save();
    manageMsg = "削除しました。"; refreshCards(); updateStat(); renderManage();
  });
  $("#exp").onclick = () => {
    const blob = new Blob([JSON.stringify(custom, null, 1)], {type:"application/json"});
    const url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = "my-cards.json"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  $("#imp").onchange = e => {
    const f = e.target.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const t = JSON.parse(r.result);
        if (!Array.isArray(t)) throw 0;
        let n = 0;
        t.forEach(c => {
          if (Array.isArray(c) && c.length === 3 && c.every(x => typeof x === "string" && x.trim()) && !CARDS.some(d => d[1] === c[1])){
            custom.push([c[0].trim(), c[1].trim(), c[2].trim()]); CARDS = BASE.concat(custom); n++;
          }
        });
        saveCustom(); manageMsg = `${n}枚を読み込みました（重複は除きました）。`;
      } catch(err){ manageMsg = "読み込めませんでした。書き出したJSONファイルを選んでください。"; }
      refreshCards(); updateStat(); renderManage();
    };
    r.readAsText(f);
  };
}

// ===== イベント =====
$("#cat").onchange = rebuild;
$("#weakOnly").onchange = rebuild;
function setMode(m){
  mode = m; current = null; manageMsg = "";
  ["card","quiz","manage"].forEach(k => $("#tab-"+k).setAttribute("aria-selected", k===m));
  rebuild();
}
$("#tab-card").onclick = () => setMode("card");
$("#tab-quiz").onclick = () => setMode("quiz");
$("#tab-manage").onclick = () => setMode("manage");
$("#reset").onclick = () => {
  if (confirm("覚えた・苦手の記録をすべて消します（自作カードは消えません）。よろしいですか？")){
    store = {known:[], weak:[]}; save(); rebuild();
  }
};
document.addEventListener("keydown", e => {
  if (mode==="card" && e.code==="Space" && queue.length && pos<queue.length && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){
    e.preventDefault(); flipped=!flipped; renderCard();
  }
});

buildCatSelect();
rebuild();
</script>
